<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeit macht frei</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@700&display=swap');
  :root {
    --bg:#0f0f0f; --surface:#1a1a1a; --border:#2e2e2e;
    --accent:#ff5a1f; --accent2:#ffb800; --red:#ff3b3b; --green:#3ddc84;
    --text:#f0f0f0; --muted:#777;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; min-height:100vh; }

  /* lock */
  #lock {
    position:fixed; inset:0; background:#0f0f0f;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; padding:32px;
  }
  #lock .lock-logo { font-family:'Unbounded',sans-serif; font-size:16px; color:var(--accent); margin-bottom:32px; }
  #lock .lock-icon { font-size:48px; margin-bottom:24px; }
  #pin-input {
    width:100%; max-width:280px; background:#fff; border:2px solid #ccc;
    border-radius:10px; padding:14px 18px; font-family:'JetBrains Mono',monospace;
    font-size:20px; color:#111; outline:none; text-align:center;
    letter-spacing:0.2em; -webkit-appearance:none; transition:border-color 0.15s;
  }
  #pin-input:focus { border-color:var(--accent); }
  #pin-input.error { border-color:var(--red); animation:shake 0.3s; }
  #lock-hint { font-size:11px; color:var(--muted); margin-top:12px; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25% { transform:translateX(-8px); }
    75% { transform:translateX(8px); }
  }

  header {
    padding:14px 16px 12px; border-bottom:1px solid var(--border);
    background:var(--surface); position:sticky; top:0; z-index:100;
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .logo { font-family:'Unbounded',sans-serif; font-size:12px; color:var(--accent); }
  .stats { font-size:11px; color:var(--muted); }
  .stats b { color:var(--accent2); }
  .search-wrap { position:relative; }
  .search-wrap svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:0.4; pointer-events:none; color:#555; }
  #search {
    width:100%; background:#fff; border:2px solid #ccc; border-radius:10px;
    padding:13px 16px 13px 42px; font-family:'JetBrains Mono',monospace;
    font-size:16px; color:#111; outline:none; transition:border-color 0.15s; -webkit-appearance:none;
  }
  #search:focus { border-color:var(--accent); }
  #search::placeholder { color:#aaa; }

  .tabs { display:flex; border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto; }
  .tab {
    flex:1; min-width:80px; padding:12px 8px; text-align:center; font-size:11px;
    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; white-space:nowrap;
  }
  .tab.active { color:var(--text); border-bottom-color:var(--accent); }
  .tab.brak-tab.active { border-bottom-color:var(--red); color:var(--red); }
  .tab.report-tab.active { border-bottom-color:var(--green); color:var(--green); }

  main { padding:12px 16px; }

  /* catalog */
  .hint { text-align:center; padding:80px 20px; color:var(--muted); font-size:13px; line-height:2; }
  .hint .big { font-size:36px; display:block; margin-bottom:8px; }
  .cards { display:flex; flex-direction:column; gap:8px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    display:flex; align-items:center; gap:12px; padding:10px 12px;
  }
  .card-img { width:54px; height:54px; border-radius:8px; object-fit:cover; background:var(--border); flex-shrink:0; }
  .card-no-img { width:54px; height:54px; border-radius:8px; background:var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .card-body { min-width:0; }
  .card-ut { font-size:11px; color:var(--accent2); margin-bottom:3px; }
  .card-name { font-size:12px; color:var(--text); line-height:1.4; }
  .highlight { background:rgba(255,90,31,0.25); color:var(--accent); border-radius:2px; padding:0 1px; }
  .no-results { text-align:center; padding:60px; color:var(--muted); font-size:13px; }
  .more-btn {
    display:block; margin:16px auto 0; background:#1a1a1a; border:1px solid var(--border);
    border-radius:8px; padding:10px 28px; color:var(--muted); font-family:'JetBrains Mono',monospace;
    font-size:12px; cursor:pointer;
  }

  /* brak */
  .brak-section-title { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:14px; padding-top:4px; }
  .brak-section-title span { color:var(--red); }
  .brak-grid { display:flex; flex-direction:column; gap:16px; }
  .brak-card { background:#fff; border-radius:14px; padding:20px 16px 16px; text-align:center; border:2px solid #eee; }
  .brak-card-name { font-size:11px; color:#999; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; }
  .brak-card-cell { font-family:'Unbounded',sans-serif; font-size:20px; color:#c0392b; margin-bottom:16px; }
  .brak-canvas { max-width:100%; display:block; margin:0 auto; }
  .brak-card-code { font-size:13px; color:#555; margin-top:8px; letter-spacing:0.15em; }

  /* report */
  .report-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; flex-wrap:wrap; gap:8px;
  }
  .report-date {
    background:#fff; border:2px solid #ccc; border-radius:8px;
    padding:8px 12px; font-family:'JetBrains Mono',monospace;
    font-size:14px; color:#111; outline:none;
  }
  .report-status { font-size:11px; color:var(--muted); }
  .report-status.ok { color:var(--green); }
  .report-status.err { color:var(--red); }
  .report-table { width:100%; border-collapse:collapse; }
  .report-table th {
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--border);
  }
  .report-table th:last-child { text-align:right; width:80px; }
  .report-table td { padding:10px; border-bottom:1px solid var(--border); font-size:13px; line-height:1.4; }
  .report-table td:last-child { text-align:right; }
  .qty-input {
    width:70px; background:var(--surface2,#242424); border:1px solid var(--border);
    border-radius:6px; padding:6px 8px; font-family:'JetBrains Mono',monospace;
    font-size:14px; color:var(--text); text-align:right; outline:none;
    transition:border-color 0.15s;
  }
  .qty-input:focus { border-color:var(--accent); }
  .qty-input.saving { border-color:var(--accent2); }
  .qty-input.saved  { border-color:var(--green); }
</style>
</head>

<div id="lock">
  <div class="lock-icon">🔒</div>
  <div class="lock-logo">Arbeit macht frei</div>
  <input id="pin-input" type="password" placeholder="••••••" autocomplete="off" inputmode="numeric">
  <div id="lock-hint">введите пароль</div>
</div>

<div id="app" style="display:none">
<header>
  <div class="header-top">
    <div class="logo">Arbeit macht frei</div>

    <input id="search" type="search" placeholder="УТ-код или название…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
</header>

<div class="tabs">
  <div class="tab active"      onclick="switchTab('catalog')">📦 Товары</div>
  <div class="tab brak-tab"   onclick="switchTab('brak')">🚫 Брак</div>
  <div class="tab report-tab" onclick="switchTab('report')">📊 Отчёт</div>
</div>

<main>
  <div id="tab-catalog"><div id="results"></div></div>

  <div id="tab-brak" style="display:none">
    <div class="brak-section-title">Ячейки · <span>БРАК</span></div>
    <div class="brak-grid" id="brak-grid"></div>
  </div>

  <div id="tab-report" style="display:none">
    <div class="report-header">
      <input type="date" class="report-date" id="report-date">
      <span class="report-status" id="report-status">загрузка…</span>

    </div>
    <table class="report-table">
      <thead><tr><th>Задача</th><th>Кол-во</th></tr></thead>
      <tbody id="report-body"></tbody>
    </table>
  </div>
</main>
</div>

// --- BARCODE ---
function code128B(text) {
  const START=104, STOP=106;
  const CHARS = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
  const PATTERNS=['11011001100','11001101100','11001100110','10010011000','10010001100','10001001100','10011001000','10011000100','10001100100','11001001000','11001000100','11000100100','10110011100','10011011100','10011001110','10111001100','10011101100','10011100110','11001110010','11001011100','11001001110','11011100100','11001110100','11101101110','11101001100','11100101100','11100100110','11101100100','11100110100','11100110010','11011011000','11011000110','11000110110','10100011000','10001011000','10001000110','10110001000','10001101000','10001100010','11010001000','11000101000','11000100010','10110111000','10110001110','10001101110','10111011000','10111000110','10001110110','11101110110','11010001110','11000101110','11011101000','11011100010','11011101110','11101011000','11101000110','11100010110','11101101000','11101100010','11100011010','11101111010','11001000010','11110001010','10100110000','10100001100','10010110000','10010000110','10000101100','10000100110','10110010000','10110000100','10011010000','10011000010','10000110100','10000110010','11000010010','11001010000','11110111010','11000010100','10001111010','10100111100','10010111100','10010011110','10111100100','10011110100','10011110010','11110100100','11110010100','11110010010','11011011110','11011110110','11110110110','10101111000','10100011110','10001011110','10111101000','10111100010','11110101000','11110100010','10111011110','10111101110','11101011110','11110101110','11010000100','11010010000','11010011100','1100011101011'];
  let codes=[START], check=START;
  for(let i=0;i<text.length;i++){const idx=CHARS.indexOf(text[i]);codes.push(idx);check+=(i+1)*idx;}
  codes.push(check%103); codes.push(STOP);
  return codes.map(c=>PATTERNS[c]).join('');
}
function drawBarcode(canvas,text){
  const p=code128B(text),bw=3,h=100;
  canvas.width=p.length*bw; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,h);
  ctx.fillStyle='#000';
  for(let i=0;i<p.length;i++) if(p[i]==='1') ctx.fillRect(i*bw,0,bw,h);
}

// --- REPORT ---
const API = SUPABASE_URL + '/rest/v1/report';
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'resolution=merge-duplicates'
};

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

let reportData = {};
let saveTimers = {};

async function loadReport(date) {
  const status = document.getElementById('report-status');
  status.textContent = 'загрузка…'; status.className='report-status';
  try {
    const r = await fetch(API + '?date=eq.' + date, {headers: HEADERS});
    const rows = await r.json();
    reportData = {};
    rows.forEach(row => reportData[row.task] = row.qty);
    renderReport(date);
    status.textContent = 'загружено ✓'; status.className='report-status ok';
  } catch(e) {
    status.textContent = 'ошибка загрузки'; status.className='report-status err';
  }
}

function renderReport(date) {
  const tbody = document.getElementById('report-body');
  tbody.innerHTML = TASKS.map(task => `
    <tr>
      <td>${task}</td>
      <td><input class="qty-input" type="number" min="0" value="${reportData[task]||0}"
        data-task="${task}" data-date="${date}"
        oninput="schedSave(this)"></td>
    </tr>`).join('');
}

function schedSave(input) {
  const task = input.dataset.task;
  input.classList.add('saving'); input.classList.remove('saved');
  clearTimeout(saveTimers[task]);
  saveTimers[task] = setTimeout(() => saveRow(input), 800);
}

async function saveRow(input) {
  const task = input.dataset.task;
  const date = input.dataset.date;
  const qty  = parseInt(input.value) || 0;
  const status = document.getElementById('report-status');
  try {
    await fetch(API, {
      method: 'POST',
      headers: HEADERS,
      body: JSON.stringify([{date, task, qty}])
    });
    input.classList.remove('saving'); input.classList.add('saved');
    status.textContent = 'сохранено ✓'; status.className='report-status ok';
    setTimeout(()=>input.classList.remove('saved'), 1500);
  } catch(e) {
    status.textContent = 'ошибка сохранения'; status.className='report-status err';
  }
}

function initReport() {
  const dateInput = document.getElementById('report-date');
  dateInput.value = todayStr();
  dateInput.addEventListener('change', () => loadReport(dateInput.value));
  loadReport(todayStr());
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',
    (tab==='catalog'&&i===0)||(tab==='brak'&&i===1)||(tab==='report'&&i===2)));
  document.getElementById('tab-catalog').style.display = tab==='catalog'?'':'none';
  document.getElementById('tab-brak').style.display    = tab==='brak'?'':'none';
  document.getElementById('tab-report').style.display  = tab==='report'?'':'none';
  document.getElementById('search').placeholder = tab==='catalog'?'УТ-код или название…':'Поиск…';
  if(tab==='brak') renderBrak('');
  if(tab==='report') initReport();
}

// --- CATALOG ---
let query='',page=0,filtered=[];
const PAGE_SIZE=50;
function hl(text,q){
  if(!q)return text;
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i===-1)return text;
  return text.slice(0,i)+'<span class="highlight">'+text.slice(i,i+q.length)+'</span>'+text.slice(i+q.length);
}
function render(){
  const el=document.getElementById('results');
  const stats=document.getElementById('stats');
  if(!query){el.innerHTML='<div class="hint"><span class="big">🔍</span>Введите УТ-код или название</div>';stats.innerHTML='<b>3825</b> товаров';return;}
  if(!filtered.length){el.innerHTML='<div class="no-results">Ничего не найдено по «'+query+'»</div>';stats.innerHTML='<b>0</b> из 3825';return;}
  const shown=filtered.slice(0,(page+1)*PAGE_SIZE);
  let h='<div class="cards">';
  for(const item of shown){
    const img=item.img
      ?`<img class="card-img" src="${item.img}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="card-no-img" style="display:none">📦</div>`
      :`<div class="card-no-img">📦</div>`;
    h+=`<div class="card">${img}<div class="card-body"><div class="card-ut">${hl(item.ut,query)}</div><div class="card-name">${hl(item.name,query)}</div></div></div>`;
  }
  h+='</div>';
  if(filtered.length>shown.length)h+='<button class="more-btn" onclick="loadMore()">Ещё '+(filtered.length-shown.length)+' записей</button>';
  el.innerHTML=h;
  stats.innerHTML='<b>'+filtered.length+'</b> из 3825';
}
function loadMore(){page++;render();}
let t;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(t);
  t=setTimeout(()=>{
    query=e.target.value.trim();page=0;
    const q=query.toLowerCase();
    const brakActive=document.getElementById('tab-brak').style.display!=='none';
    if(brakActive){renderBrak(query);}
    else{filtered=q?CATALOG.filter(i=>i.ut.toLowerCase().includes(q)||i.name.toLowerCase().includes(q)):[];render();}
  },150);
});
