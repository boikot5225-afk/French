<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An II — Firebase test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#eee;margin:0;padding:24px;line-height:1.5}
    .card{max-width:820px;margin:0 auto;background:#1b1b1f;border:1px solid #333;border-radius:16px;padding:20px}
    button{background:#a62a21;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
    button:disabled{opacity:.6;cursor:wait}
    input{background:#0b0b0d;border:1px solid #333;border-radius:10px;color:#eee;padding:10px 12px;margin:4px 6px 4px 0;min-width:220px}
    pre{background:#0b0b0d;border:1px solid #333;border-radius:12px;padding:14px;overflow:auto;white-space:pre-wrap}
    code{background:#0b0b0d;border:1px solid #333;border-radius:6px;padding:1px 5px}
    .ok{color:#7ad68a}.bad{color:#ff7b72}.warn{color:#ffd166}.muted{color:#aaa}
    .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
  </style>
  <script src="js/firebase-config.js?v=23.0-writefix"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script>if(!window.firebase){document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-app-compat.js"><\/script>')}</script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script>if(window.firebase&&!firebase.auth){document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-auth-compat.js"><\/script>')}</script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>if(window.firebase&&!firebase.database){document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-database-compat.js"><\/script>')}</script>
</head>
<body>
  <div class="card">
    <h1>Firebase smoke test</h1>
    <p class="muted">Проверяет конфиг, SDK, вход/регистрацию, запись прогресса, UID, админку и загрузку <code>/verbs</code>. Также ловит ошибку <code>/Verbs</code> с большой буквы.</p>
    <div class="row">
      <input id="email" type="email" placeholder="email Firebase">
      <input id="password" type="password" placeholder="пароль">
      <button id="loginBtn">Войти</button>
      <button id="registerBtn">Создать тест-аккаунт</button>
      <button id="profileBtn">Записать/проверить профиль</button>
      <button id="progressBtn">Проверить запись прогресса</button>
      <button id="logoutBtn">Выйти</button>
      <button id="btn">Проверить Firebase</button>
    </div>
    <pre id="out">Нажми «Проверить Firebase». Если хочешь проверить права админа — сначала войди.</pre>
  </div>
  <script>
    const out = document.getElementById('out');
    const btn = document.getElementById('btn');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const registerBtn = document.getElementById('registerBtn');
    const profileBtn = document.getElementById('profileBtn');
    const progressBtn = document.getElementById('progressBtn');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    function line(s, cls){ out.innerHTML += (cls?`<span class="${cls}">${escapeHtml(s)}</span>`:escapeHtml(s)) + '\n'; }
    function raw(s){ out.innerHTML += s + '\n'; }
    function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function reset(){ out.textContent=''; }
    function missingConfig(c){ return !c || ['apiKey','databaseURL','projectId','appId'].some(k => !String(c[k]||'').trim() || String(c[k]).includes('PASTE_')); }
    function rowsFromSnap(snap){ const data=snap.exists()?snap.val():null; return Array.isArray(data) ? data.filter(Boolean) : Object.values(data || {}); }

    function init(){
      if(!window.firebase) throw new Error('Firebase SDK не загрузился');
      if(missingConfig(window.FIREBASE_CONFIG)) throw new Error('Заполни js/firebase-config.js реальным Firebase config');
      if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
      return { auth: firebase.auth(), db: firebase.database() };
    }


    function explainAuthError(e){
      const code = String(e && e.code || '').toLowerCase();
      const msg = String(e && e.message || e || '');
      if(code.includes('operation-not-allowed')) return 'Email/Password выключен: Firebase Console → Authentication → Sign-in method → Email/Password → Enable.';
      if(code.includes('configuration-not-found')) return 'Authentication не настроен: Firebase Console → Authentication → Get started, потом включи Email/Password.';
      if(code.includes('unauthorized-domain')) return 'Домен не разрешён: Authentication → Settings → Authorized domains → добавь домен из адресной строки без https и без пути.';
      if(code.includes('email-already-in-use')) return 'Такой email уже есть. Это не смерть, это бюрократия: жми «Войти».';
      if(code.includes('weak-password')) return 'Пароль меньше 6 символов.';
      if(code.includes('network-request-failed')) return 'Сеть режет Firebase Auth. Проверь VPN/интернет/доступ к googleapis.';
      return msg;
    }

    loginBtn.onclick = async function(){
      reset(); loginBtn.disabled=true;
      try{
        const { auth } = init();
        const cred = await auth.signInWithEmailAndPassword(email.value.trim(), password.value);
        line('✓ Вход выполнен', 'ok');
        line('UID: ' + cred.user.uid, 'ok');
        line('Теперь этот UID должен быть в Realtime Database: /admins/' + cred.user.uid + ' = true', 'warn');
      }catch(e){ line('✗ ' + (e.message || e), 'bad'); }
      finally{ loginBtn.disabled=false; }
    };

    registerBtn.onclick = async function(){
      reset(); registerBtn.disabled=true;
      try{
        const { auth, db } = init();
        const em = email.value.trim();
        const pw = password.value;
        if(!em || !pw) throw new Error('Введи email и пароль. Для теста лучше отдельный email, потому что Firebase реально создаёт аккаунт.');
        const cred = await auth.createUserWithEmailAndPassword(em, pw);
        line('✓ Аккаунт создан', 'ok');
        line('UID: ' + cred.user.uid, 'ok');
        await cred.user.getIdToken(true);
        await db.ref('profiles/' + cred.user.uid).update({id:cred.user.uid, username:em.split('@')[0], email:em, updated_at:new Date().toISOString()});
        line('✓ Профиль записан в /profiles/' + cred.user.uid, 'ok');
      }catch(e){
        line('✗ ' + (e.code || '') + ' ' + (e.message || e), 'bad');
        line('→ ' + explainAuthError(e), 'warn');
      }finally{ registerBtn.disabled=false; }
    };

    profileBtn.onclick = async function(){
      reset(); profileBtn.disabled=true;
      try{
        const { auth, db } = init();
        const user = auth.currentUser;
        if(!user) throw new Error('Сначала войди или создай аккаунт.');
        await user.getIdToken(true);
        await db.ref('profiles/' + user.uid).update({id:user.uid, username:(user.email||'user').split('@')[0], email:user.email||'', updated_at:new Date().toISOString()});
        const snap = await db.ref('profiles/' + user.uid).get();
        line('✓ Профиль записан и прочитан:', 'ok');
        line(JSON.stringify(snap.val(), null, 2));
      }catch(e){
        line('✗ ' + (e.code || '') + ' ' + (e.message || e), 'bad');
        line('→ ' + explainAuthError(e), 'warn');
      }finally{ profileBtn.disabled=false; }
    };



    progressBtn.onclick = async function(){
      reset(); progressBtn.disabled=true;
      try{
        const { auth, db } = init();
        const user = auth.currentUser;
        if(!user) throw new Error('Сначала войди или создай аккаунт.');
        await user.getIdToken(true);
        const now = new Date().toISOString();
        const updates = {};
        updates['stats/' + user.uid + '/_smoke'] = {total:1, correct:1, updated_at:now};
        updates['srs/' + user.uid + '/_smoke'] = {interval:1, ease_factor:2.5, repetitions:1, due_date:now.slice(0,10), last_review:now.slice(0,10), marked_known:false, updated_at:now};
        updates['meta/' + user.uid + '/_smoke_last'] = now;
        await db.ref().update(updates);
        line('✓ Запись прогресса работает', 'ok');
        line('UID: ' + user.uid, 'ok');
        line('Созданы/обновлены:', 'ok');
        Object.keys(updates).forEach(p => line('/' + p, 'ok'));
      }catch(e){
        line('✗ ' + (e.code || '') + ' ' + (e.message || e), 'bad');
        line('→ Если тут permission_denied — проблема в Rules или ты не вошёл в Firebase Auth. Для личного прогресса /admins не нужен; нужны правила на stats/srs/meta.', 'warn');
      }finally{ progressBtn.disabled=false; }
    };

    logoutBtn.onclick = async function(){
      reset();
      try{ const { auth } = init(); await auth.signOut(); line('✓ Вышел', 'ok'); }
      catch(e){ line('✗ ' + (e.message || e), 'bad'); }
    };

    btn.onclick = async function(){
      reset(); btn.disabled=true;
      try{
        const { auth, db } = init();
        line('✓ SDK инициализирован', 'ok');
        line('databaseURL: ' + window.FIREBASE_CONFIG.databaseURL);

        const user = auth.currentUser;
        if(user){
          line('✓ Пользователь вошёл: ' + (user.email || 'без email'), 'ok');
          line('UID: ' + user.uid, 'ok');
          try{
            const adminSnap = await db.ref('admins/' + user.uid).get();
            if(adminSnap.val() === true) line('✓ admin=true найден', 'ok');
            else line('⚠ admin=true не найден. Для импорта надо создать /admins/' + user.uid + ' = true', 'warn');
          }catch(e){ line('⚠ Не смог проверить admin=true: ' + (e.message || e), 'warn'); }
        }else{
          line('⚠ Пользователь не вошёл. Читать /verbs можно, но импортировать без admin=true нельзя.', 'warn');
        }

        const t0 = performance.now();
        const lower = await db.ref('verbs').get();
        const lowerMs = Math.round(performance.now()-t0);
        const lowerRows = rowsFromSnap(lower);

        let upperRows = [];
        let upperErr = null;
        try{
          const t1 = performance.now();
          const upper = await db.ref('Verbs').get();
          const upperMs = Math.round(performance.now()-t1);
          upperRows = rowsFromSnap(upper);
          if(upperRows.length) line(`⚠ Найден /Verbs с большой буквы: ${upperRows.length} записей за ${upperMs} мс`, 'warn');
        }catch(e){ upperErr = e; }

        if(lowerRows.length){
          line(`✓ /verbs загружен: ${lowerRows.length} записей за ${lowerMs} мс`, 'ok');
          line('Первые записи:');
          line(JSON.stringify(lowerRows.slice(0,6).map(v => ({id:v.id, inf:v.inf, meaning:v.meaning})), null, 2));
        }else if(upperRows.length){
          line('⚠ /verbs пустой, но /Verbs существует. Приложение v21 умеет временно читать /Verbs, но правильно — переимпортировать в /verbs маленькими буквами.', 'warn');
        }else{
          line(`✗ /verbs пустой или нет доступа (${lowerMs} мс). Импортируй firebase/firebase-seed-root.json в корень базы или seed-verbs.json в путь verbs.`, 'bad');
          if(upperErr) line('Проверка /Verbs тоже упала: ' + (upperErr.message || upperErr), 'bad');
        }
      }catch(e){
        line('✗ ' + (e.message || e), 'bad');
      }finally{ btn.disabled=false; }
    };
  </script>
</body>
</html>
